  });
};
A.shareOpt = el => { const o = S.settings.share, k = el.dataset.k; if (k === 'format') o.format = el.dataset.v; else o[k] = !o[k]; save(); refreshSheet(); };
async function cardBlob() { const c = drawDayCard(S.settings.share); return new Promise(r => c.toBlob(r, 'image/png')); }
A.shareGo = async () => {
  const D = dayData(), b = await cardBlob();
  const txt = `My day: ${D.done}/${S.habits.length} habits${D.focusMin ? ` · ${fmtMin(D.focusMin)} deep work` : ''}${D.readMin ? ` · ${fmtMin(D.readMin)} reading` : ''} · 🔥 ${streakNow()}-day streak`;
  await shareFile(`my-day-${today()}.png`, b, txt);
};
A.shareSave = async () => { download(`my-day-${today()}.png`, await cardBlob(), 'image/png'); };

/* ---------- calendar files (.ics) ---------- */
const icsEsc = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
const icsDate = s => s.replace(/-/g, '');
function icsFold(line) { const out = []; while (line.length > 72) { out.push(line.slice(0, 72)); line = ' ' + line.slice(72); } out.push(line); return out.join('\r\n'); }
function ics(events) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Growth Diary//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  events.forEach(e => { L.push('BEGIN:VEVENT', `UID:${e.uid}`, `DTSTAMP:${stamp}`, ...e.lines, `SUMMARY:${icsEsc(e.summary)}`); if (e.desc) L.push(`DESCRIPTION:${icsEsc(e.desc)}`); if (e.alarm) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(e.summary)}`, `TRIGGER:${e.alarm}`, 'END:VALARM'); L.push('END:VEVENT'); });
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}
function sendIcs(name, content) {
  download(name, new Blob([content], { type: 'text/calendar' }));
  toast('Calendar file ready. Tap it to add the event');
}
function reminderHelp(fromSetup) {
  return `<form data-f="reminderSave"><div class="small mb">One gentle nudge a day, nothing more. It goes into your iPhone Calendar as a 10-minute daily event with an alert. Then open the app from your Home Screen to set goals, tick habits and pick something to read.</div>
    ${field('Time', `<input type="time" name="time" value="${esc(S.settings.reminderTime)}">`)}
    <button class="btn primary block mb">📅 Add daily reminder to Calendar</button>
    <div class="hint">If your iPhone asks, tap Download, then open the file and tap Add to Calendar.</div></form>
    <details><summary class="small" style="color:var(--accent);cursor:pointer">Prefer the Shortcuts app?</summary><ol class="small muted" style="padding-left:18px">
      <li>Open <b>Shortcuts</b> → <b>Automation</b> → <b>＋</b> → <b>Time of Day</b>.</li><li>Pick your time, <b>Daily</b>, then <b>Run Immediately</b>.</li>
      <li>Add the action <b>Show Notification</b> with text like "Daily check-in: goals, habits, reading".</li></ol>
      <div class="tiny muted">To change the time later, edit or delete the event in Calendar, then add a new one here.</div></details>
    ${fromSetup ? `<button class="btn block mt" data-a="closeSheet">Skip for now</button>` : ''}`;
}
F.reminderSave = o => {
  S.settings.reminderTime = o.time || '08:00'; save();
  const [hh, mm] = S.settings.reminderTime.split(':');
  const content = ics([{ uid: 'growth-diary-daily-checkin', lines: [`DTSTART:${icsDate(today())}T${hh}${mm}00`, 'DURATION:PT10M', 'RRULE:FREQ=DAILY'],
    summary: '🌱 Daily check-in', desc: "Open Growth Diary from your Home Screen: set today's goals, tick your habits, pick something to read.", alarm: 'PT0M' }]);
  sendIcs('growth-daily-reminder.ics', content);
  if (SHEETS.length) closeSheet();
};
A.reminderIcs = () => F.reminderSave({ time: S.settings.reminderTime });
A.birthdaysIcs = () => {
  const ev = S.contacts.filter(c => c.birthday).map(c => ({ uid: `bday-${c.id}@growth-diary`, lines: [`DTSTART;VALUE=DATE:${icsDate(c.birthday)}`, 'RRULE:FREQ=YEARLY', 'TRANSP:TRANSPARENT'], summary: `🎂 ${c.name}'s birthday`, alarm: 'PT9H' }));
  if (!ev.length) return toast('No birthdays saved yet');
  sendIcs('birthdays.ics', ics(ev));
};
A.deadlinesIcs = () => {
  const ev = [...S.projects.filter(p => p.deadline && p.status !== 'completed').map(p => ({ uid: `proj-${p.id}@growth-diary`, d: p.deadline, s: `📊 ${p.name} deadline` })),
    ...S.tasks.filter(t => t.deadline && !t.done).map(t => ({ uid: `task-${t.id}@growth-diary`, d: t.deadline, s: `📝 ${t.text}` }))]
    .filter(x => x.d >= today()).map(x => ({ uid: x.uid, lines: [`DTSTART;VALUE=DATE:${icsDate(x.d)}`, `DTEND;VALUE=DATE:${icsDate(addDays(x.d, 1))}`, 'TRANSP:TRANSPARENT'], summary: x.s, alarm: '-PT15H' }));
  if (!ev.length) return toast('No upcoming deadlines');
  sendIcs('deadlines.ics', ics(ev));
};

/* ---------- backup & restore ---------- */
A.exportData = async () => {
  const data = JSON.parse(JSON.stringify(S));
  data.settings.apiKey = ''; data.timers = { workout: null, focus: null };
  data.meta = { app: APP.name, version: APP.version, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  await shareFile(`growth-diary-backup-${today()}.json`, blob);
  S.settings.lastBackup = today(); save(); render();
};
A.importData = async () => {
  const file = await pickFile('.json,application/json'); if (!file) return;
  let inc;
  try { inc = JSON.parse(await file.text()); } catch (e) { return toast('That file is not a valid backup'); }
  if (!inc || typeof inc !== 'object' || !(inc.xp || inc.journal || inc.library || inc.habits)) return toast('That file is not a Growth Diary backup');
  const n = k => Array.isArray(inc[k]) ? inc[k].length : 0;
  openSheet('Restore data', () => `<div class="card small">${inc.meta && inc.meta.source === 'desktop' ? '🖥️ From the desktop app<br>' : ''}${[['journal', 'journal entries'], ['library', 'sources'], ['workouts', 'workouts'], ['sleep', 'sleep logs'], ['projects', 'projects'], ['tasks', 'tasks'], ['sessions', 'focus sessions'], ['vocab', 'words'], ['contacts', 'contacts'], ['ideas', 'ideas'], ['habits', 'habits']].filter(([k]) => n(k)).map(([k, l]) => `${n(k)} ${l}`).join(' · ') || 'No entries found'}${inc.xp ? `<br>${inc.xp.total || 0} XP` : ''}</div>
    <button class="btn primary block mb" data-a="importMerge">Merge with what's on this phone</button>
    <button class="btn danger block" data-a="importReplace">Replace everything on this phone</button>`);
  IMPORT = inc;
};
let IMPORT = null;
A.importReplace = () => { if (!confirm('Replace all data on this phone with the backup?')) return; const key = S.settings.apiKey; S = migrate(IMPORT); S.settings.apiKey = key; flush(); closeAllSheets(); render(); toast('Backup restored'); };
A.importMerge = () => { mergeState(IMPORT); checkBadges(); flush(); closeAllSheets(); render(); toast('Data merged'); };
function mergeState(inc) {
  const idMap = {};
  ['habits', 'topics'].forEach(k => (inc[k] || []).forEach(x => {
    const same = S[k].find(y => y.id === x.id || String(y.name).toLowerCase() === String(x.name).toLowerCase());
    if (same) idMap[x.id] = same.id; else S[k].push(x);
  }));
  ['journal', 'workouts', 'sleep', 'nutrition', 'projects', 'tasks', 'sessions', 'library', 'readingLog', 'claudeLog', 'ideas', 'vocab', 'practice', 'contacts', 'interactions'].forEach(k => {
    if (!Array.isArray(inc[k])) return;
    const ids = new Set(S[k].map(x => x.id));
    inc[k].forEach(x => { if (!ids.has(x.id)) { if (k === 'library' && x.topic && idMap[x.topic]) x.topic = idMap[x.topic]; S[k].push(x); } });
  });
  Object.entries(inc.habitLog || {}).forEach(([d, log]) => { const t = S.habitLog[d] = S.habitLog[d] || {}; Object.entries(log).forEach(([hid, v]) => { const id = idMap[hid] || hid; if (t[id] === undefined) t[id] = v; }); });
  Object.entries(inc.days || {}).forEach(([d, v]) => { const t = S.days[d] = S.days[d] || { goals: [] }; (v.goals || []).forEach(g => { if (!t.goals.some(x => x.id === g.id)) t.goals.push(g); }); });
  Object.entries(inc.langGoals || {}).forEach(([k, v]) => { if (!S.langGoals[k]) S.langGoals[k] = v; });
  if (inc.relPlans && !S.relPlans) S.relPlans = inc.relPlans;
  if (inc.settings && Array.isArray(inc.settings.languages)) S.settings.languages = [...new Set([...S.settings.languages, ...inc.settings.languages])];
  if (inc.xp) {
    const ids = new Set(S.xp.history.map(h => h.id));
    (inc.xp.history || []).forEach(h => { if (!ids.has(h.id)) S.xp.history.push(h); });
    S.xp.history.sort((a, b) => String(a.date).localeCompare(b.date));
    Object.assign(S.xp.keys, inc.xp.keys || {});
    S.xp.total = sum(S.xp.history, h => h.xp);
  }
  if (inc.streak) S.streak.longest = Math.max(S.streak.longest, inc.streak.longest || 0);
  Object.entries(inc.badges || {}).forEach(([k, d]) => { if (!S.badges[k] || d < S.badges[k]) S.badges[k] = d; });
}

/* =========================================================================
   BOOT
   ========================================================================= */
function applyTheme() {
  const t = S.settings.theme, dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const m = $('meta[name="theme-color"]'); if (m) m.content = dark ? '#000000' : '#f2f2f7';
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => S && applyTheme());

async function boot() {
  await loadState();
  applyTheme();
  checkBadges();
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
  // re-render when the day changes or the app comes back to the foreground
  let lastDay = today();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (today() !== lastDay) { lastDay = today(); } render(); } });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing; if (!nw) return;
        nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('Update ready: close and reopen the app'); });
      });
    }).catch(() => { });
  }
}
boot();
