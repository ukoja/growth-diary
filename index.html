<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Growth Diary</title>
<meta name="description" content="Private self-development diary: habits, learning, journal, health and work.">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Growth">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root {
  --bg: #f2f2f7; --card: #ffffff; --card2: #f7f7fa; --text: #1c1c1e; --sub: #6b6b72; --faint: #a1a1a8;
  --line: #e4e4ea; --fill: #ececf1; --accent: #5b5bd6; --accent-2: #8b5cf6; --accent-soft: #ececfd;
  --ok: #1f9d63; --ok-soft: #dcf5e8; --warn: #d98a05; --warn-soft: #fdf1d8; --bad: #e5484d; --bad-soft: #fde4e4;
  --c-journal: #9b59b6; --c-health: #e74c3c; --c-work: #3498db; --c-lang: #16a085; --c-ideas: #e5a00d;
  --c-social: #e67e22; --c-learn: #4f46e5; --c-faith: #0f9d8a;
  --grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --r: 18px; --r-sm: 12px;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  color-scheme: light;
}
html[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --card2: #232326; --text: #f2f2f7; --sub: #9e9ea6; --faint: #6c6c72;
  --line: #2e2e32; --fill: #2c2c30; --accent: #8b8bff; --accent-2: #a78bfa; --accent-soft: #26264a;
  --ok: #3ccf8e; --ok-soft: #14382a; --warn: #f5b33d; --warn-soft: #3b2e12; --bad: #ff6b6f; --bad-soft: #3d1a1b;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
body {
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
}
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
h1, h2, h3, h4 { margin: 0; }

#app { min-height: 100vh; }
#view { padding: calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 96px); max-width: 640px; margin: 0 auto; }

/* ---------- Header ---------- */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 4px 2px 14px; }
.top h1 { font-size: 32px; font-weight: 800; letter-spacing: -.02em; }
.top .sub { color: var(--sub); font-size: 14px; margin-bottom: 2px; }
.top .actions { display: flex; gap: 8px; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 600; padding: 6px 0; background: none; border: 0; cursor: pointer; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 20px; cursor: pointer; color: var(--accent); }
.icon-btn.solid { background: var(--accent); color: #fff; }

/* ---------- Cards & lists ---------- */
.card { background: var(--card); border-radius: var(--r); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.card.tight { padding: 6px 0; }
.card h3 { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
.card-head .link { font-size: 14px; color: var(--accent); font-weight: 600; background: none; border: 0; cursor: pointer; padding: 0; }
.muted { color: var(--sub); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.center { text-align: center; }
.mt { margin-top: 10px; } .mt2 { margin-top: 16px; } .mb { margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.section-label { font-size: 13px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: .04em; margin: 18px 4px 8px; }

.list { list-style: none; margin: 0; padding: 0; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; min-height: 52px; }
.card .li:last-child, .list .li:last-child { border-bottom: 0; }
.li .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; flex: none; background: var(--fill); }
.li .body { flex: 1; min-width: 0; }
.li .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .title.wrap { white-space: normal; }
.li .meta { font-size: 13px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .chev { color: var(--faint); font-size: 18px; }
.li.done .title { color: var(--sub); text-decoration: line-through; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 600; background: var(--fill); color: var(--text); cursor: pointer; min-height: 44px; text-align: center; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.grad { background: var(--grad); color: #fff; }
.btn.ok { background: var(--ok); color: #fff; }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.block { width: 100%; }
.btn.sm { padding: 7px 12px; min-height: 34px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row .btn { flex: 1; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

.seg { display: flex; background: var(--fill); border-radius: 11px; padding: 3px; margin-bottom: 14px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--sub); cursor: pointer; }
.seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--fill); color: var(--sub); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }

/* ---------- Check ---------- */
.check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; background: transparent; cursor: pointer; color: #fff; font-size: 16px; font-weight: 800; transition: transform .12s; }
.check.on { background: var(--ok); border-color: var(--ok); }
.check:active { transform: scale(.88); }
.parts { display: flex; gap: 5px; margin-left: auto; }
.part { min-width: 34px; height: 30px; border-radius: 9px; border: 1.5px solid var(--line); background: transparent; font-size: 12px; font-weight: 700; color: var(--sub); cursor: pointer; padding: 0 5px; }
.part.on { background: var(--c-faith); border-color: var(--c-faith); color: #fff; }

/* ---------- Forms ---------- */
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 13px; font-weight: 600; color: var(--sub); margin: 0 2px 6px; }
input[type=text], input[type=url], input[type=number], input[type=date], input[type=time], input[type=search], input[type=password], textarea, select {
  width: 100%; font-size: 16px; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); outline: none; -webkit-appearance: none; appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--sub) 50%), linear-gradient(135deg, var(--sub) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
textarea.big { min-height: 180px; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 2px; cursor: pointer; }
.switch { width: 50px; height: 30px; border-radius: 999px; background: var(--fill); position: relative; flex: none; transition: background .2s; border: 0; cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch.on { background: var(--ok); }
.switch.on::after { transform: translateX(20px); }
.hint { font-size: 13px; color: var(--sub); margin: -4px 2px 12px; }

/* ---------- Hero / stats ---------- */
.hero { background: var(--grad); color: #fff; border-radius: 22px; padding: 18px; margin-bottom: 14px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.08); }
.hero .lvl { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
.hero .avatar { font-size: 38px; width: 58px; height: 58px; border-radius: 18px; background: rgba(255,255,255,.18); display: grid; place-items: center; }
.hero .t1 { font-size: 19px; font-weight: 800; }
.hero .t2 { font-size: 13px; opacity: .85; }
.bar { height: 8px; border-radius: 99px; background: rgba(0,0,0,.08); overflow: hidden; }
.hero .bar { background: rgba(255,255,255,.25); margin-top: 14px; position: relative; z-index: 1; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.hero .bar > i { background: #fff; }
.hero .foot { display: flex; justify-content: space-between; font-size: 13px; margin-top: 8px; opacity: .92; position: relative; z-index: 1; }
.stat { background: var(--card2); border-radius: 14px; padding: 12px; }
.stat .v { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.stat .k { font-size: 12px; color: var(--sub); font-weight: 600; }
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.quick button { border: 0; background: var(--card2); border-radius: 14px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; cursor: pointer; }
.quick button .e { font-size: 24px; }
.banner { border-radius: var(--r); padding: 14px 16px; margin-bottom: 14px; background: var(--accent-soft); color: var(--text); font-size: 14px; }
.banner b { color: var(--accent); }
.banner.warn { background: var(--warn-soft); }

.empty { text-align: center; color: var(--sub); padding: 26px 12px; font-size: 14px; }
.empty .e { font-size: 34px; display: block; margin-bottom: 6px; }

.timer { font-size: 54px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: -.02em; padding: 6px 0 10px; }

.ask-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ask-card { background: var(--card); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); cursor: pointer; border: 0; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.ask-card .e { font-size: 24px; }
.ask-card .t { font-weight: 700; font-size: 15px; }
.ask-card .d { font-size: 12.5px; color: var(--sub); line-height: 1.35; }

.md { font-size: 15px; line-height: 1.55; }
.md h4 { font-size: 16px; margin: 14px 0 6px; }
.md p { margin: 0 0 10px; }
.md ul { margin: 0 0 10px; padding-left: 20px; }
.md li { margin-bottom: 4px; }
.sug { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: flex-start; }
.sug .body { flex: 1; min-width: 0; }
.sug .t { font-weight: 700; }
.sug .m { font-size: 13px; color: var(--sub); }
.sug .w { font-size: 13px; margin-top: 4px; }
.prompt-box { font-size: 13px; font-family: ui-monospace, Menlo, monospace; min-height: 160px; }

.badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.badge { background: var(--card2); border-radius: 14px; padding: 12px 8px; text-align: center; }
.badge .e { font-size: 30px; display: block; }
.badge .n { font-size: 12.5px; font-weight: 700; margin-top: 4px; }
.badge .d { font-size: 11px; color: var(--sub); margin-top: 2px; line-height: 1.3; }
.badge.locked { opacity: .45; filter: grayscale(1); }

.dots { display: flex; gap: 4px; }
.dot { width: 26px; height: 26px; border-radius: 8px; background: var(--fill); border: 0; font-size: 10px; font-weight: 700; color: var(--sub); cursor: pointer; padding: 0; }
.dot.on { background: var(--ok); color: #fff; }
.dot.half { background: var(--ok-soft); color: var(--ok); }
.dot.today { outline: 2px solid var(--accent); outline-offset: 1px; }

.flash { background: var(--card2); border-radius: 18px; padding: 26px 16px; text-align: center; margin-bottom: 14px; }
.flash .w { font-size: 34px; font-weight: 800; }
.flash .tr { font-size: 20px; margin-top: 12px; color: var(--sub); }
.flash .ex { font-size: 14px; margin-top: 8px; color: var(--faint); font-style: italic; }

/* ---------- Tab bar ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: space-around; padding: 6px 6px calc(var(--safe-b) + 6px);
  background: color-mix(in srgb, var(--card) 86%, transparent); -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px); border-top: 1px solid var(--line); }
.tabbar button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 600; color: var(--faint); padding: 4px 0; cursor: pointer; max-width: 110px; }
.tabbar button svg { width: 26px; height: 26px; }
.tabbar button.on { color: var(--accent); }

/* ---------- Sheet ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; }
.sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.35); opacity: 0; transition: opacity .25s; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - var(--safe-t) - 28px); background: var(--bg); border-radius: 20px 20px 0 0; transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.9,.3,1); display: flex; flex-direction: column; max-width: 640px; margin: 0 auto; }
.sheet-wrap.open .sheet-bg { opacity: 1; }
.sheet-wrap.open .sheet { transform: translateY(0); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; gap: 10px; }
.sheet-head h2 { font-size: 19px; font-weight: 800; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-head .x { border: 0; background: var(--fill); width: 32px; height: 32px; border-radius: 50%; font-size: 15px; cursor: pointer; color: var(--sub); flex: none; }
.sheet-grip { width: 38px; height: 5px; border-radius: 9px; background: var(--line); margin: 8px auto 0; }
.sheet-body { overflow-y: auto; padding: 4px 16px calc(var(--safe-b) + 20px); -webkit-overflow-scrolling: touch; }

/* ---------- Toast ---------- */
.toasts { position: fixed; top: calc(var(--safe-t) + 10px); left: 0; right: 0; z-index: 80; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast { background: rgba(28,28,30,.92); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.2); animation: tin .25s ease-out; max-width: 90%; text-align: center; }
.toast.xp { background: linear-gradient(135deg, #667eea, #764ba2); }
@keyframes tin { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }

.feed-card .feed-title { font-size: 17px; font-weight: 700; line-height: 1.3; margin: 10px 0 3px; }
.feed-card .feed-title a { color: var(--text); }
.feed-actions { display: flex; gap: 6px; margin-top: 12px; }
.feed-actions .btn { flex: 1; padding: 8px 4px; min-height: 38px; font-size: 13.5px; border-radius: 10px; }
.feed-actions .btn:last-child:not(.sm) { flex: 0 0 44px; }
.card.dim { opacity: .62; }
.img-preview { width: 100%; border-radius: 16px; display: block; box-shadow: var(--shadow); background: var(--fill); }
.share-wrap { max-width: 300px; margin: 0 auto 14px; }

@media (min-width: 700px) { #view { padding-top: 28px; } }

</style>
</head>
<body>
<div id="app"><main id="view"><div class="empty" style="padding-top:40vh">🌱</div></main><div id="tabs"></div></div>
<noscript>Growth Diary needs JavaScript.</noscript>
<script>
'use strict';
/* =========================================================================
   Growth Diary: core helpers, local storage, XP and badges
   Everything is stored on this device (IndexedDB). Nothing leaves it unless
   the user taps a Claude, Share or Export button.
   ========================================================================= */
const APP = { name: 'Growth Diary', version: '1.0.0' };

// ---------- tiny helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseYmd = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000); // b - a in days
const fmtDate = (s, o = { day: 'numeric', month: 'short' }) => s ? parseYmd(s).toLocaleDateString(undefined, o) : '';
const fmtLong = s => fmtDate(s, { weekday: 'short', day: 'numeric', month: 'short' });
const fmtMin = m => { m = Math.round(m || 0); if (m < 60) return `${m}m`; const h = Math.floor(m / 60), r = m % 60; return r ? `${h}h ${r}m` : `${h}h`; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const avg = (arr, f = x => x) => arr.length ? sum(arr, f) / arr.length : 0;
const inLast = (date, days) => date && daysBetween(date, today()) < days && daysBetween(date, today()) >= 0;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const byId = (arr, id) => arr.find(x => x.id === id);
const opts = (list, sel) => list.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}"${String(v) === String(sel) ? ' selected' : ''}>${esc(l)}</option>`; }).join('');
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

// ---------- default data ----------
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
// Starter menus shown in Set up. The app ships with a few generic picks; everything personal is chosen on the phone.
const HABIT_MENU = [
  ['🏋️', 'Exercise', 'Health'], ['🚶', 'Walk 10 minutes', 'Health'], ['🤸', 'Stretch', 'Health'], ['💧', 'Drink water', 'Health'],
  ['😴', 'Sleep on time', 'Health'], ['📖', 'Read', 'Mind'], ['✍️', 'Journal', 'Mind'], ['🧘', 'Meditate', 'Mind'],
  ['🙏', 'Gratitude', 'Mind'], ['📵', 'Phone-free first hour', 'Mind'], ['🗣️', 'Practise a language', 'Mind'], ['📚', 'Study', 'Work'],
  ['💻', 'Build a project', 'Work'], ['📞', 'Call family', 'Social'], ['📗', 'Read scripture', 'Faith'],
  ['🕌', 'Prayer (5 daily)', 'Faith', ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha']],
];
const TOPIC_MENU = [

let S = null, _db = null, _saveT = null;
function idb() {

    const r = indexedDB.open('growth-diary', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }

  const d = pts.map((p, k) => `${k ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><circle cx="${X(last[0])}" cy="${Y(last[1])}" r="3.5" fill="${color}"/></svg>`;
}
function bars(values, labels, { h = 90, color = 'var(--accent)' } = {}) {
  const mx = Math.max(1, ...values);
  return `<div style="display:flex;align-items:flex-end;gap:6px;height:${h}px">${values.map((v, i) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end"><div class="tiny muted">${v || ''}</div><div style="width:100%;border-radius:6px;background:${color};opacity:${v ? 1 : .15};height:${Math.max(4, (v / mx) * (h - 34))}px"></div><div class="tiny muted">${labels[i]}</div></div>`).join('')}</div>`;
}
function ring(pct, size = 92, stroke = 10, color = 'var(--ok)', inner = '') {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<div style="position:relative;width:${size}px;height:${size}px;flex:none"><svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--fill)" stroke-width="${stroke}"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - clamp(pct, 0, 1))}"/></svg><div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800">${inner}</div></div>`;
}

// ---------- markdown-lite (safe: escapes first) ----------
function mdInline(t) {
  return t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\w)/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}
function md(src, { skipAdd = true } = {}) {
  const out = []; let list = null, para = [];
  const flushP = () => { if (para.length) { out.push(`<p>${mdInline(para.join(' '))}</p>`); para = []; } };
  const flushL = () => { if (list) { out.push(`<ul>${list.map(x => `<li>${mdInline(x)}</li>`).join('')}</ul>`); list = null; } };
  for (const raw of esc(src).split('\n')) {
    const line = raw.trim();
    if (skipAdd && /^[*`>\s-]*ADD:/i.test(line.replace(/\*\*/g, ''))) continue;
    if (!line) { flushP(); flushL(); continue; }
    let m;
    if ((m = line.match(/^#{1,4}\s+(.*)/))) { flushP(); flushL(); out.push(`<h4>${mdInline(m[1])}</h4>`); continue; }
    if ((m = line.match(/^(?:[-*•]|\d+[.)])\s+(.*)/))) { flushP(); (list = list || []).push(m[1]); continue; }
    if (/^-{3,}$/.test(line)) { flushP(); flushL(); continue; }
    flushL(); para.push(line);
  }
  flushP(); flushL();
  return `<div class="md">${out.join('')}</div>`;
}

// ---------- sheets (bottom modals) ----------
const SHEETS = [];
function openSheet(title, renderFn, onMount) {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="sheet-bg"></div><div class="sheet" role="dialog"><div class="sheet-grip"></div><div class="sheet-head"><h2></h2><button class="x" data-a="closeSheet" aria-label="Close">✕</button></div><div class="sheet-body"></div></div>`;
  document.body.appendChild(wrap);
  const rec = { wrap, title, renderFn, onMount };
  SHEETS.push(rec);
  paintSheet(rec);
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('open')));
  return rec;
}
function paintSheet(rec) {
  const t = typeof rec.title === 'function' ? rec.title() : rec.title;
  $('.sheet-head h2', rec.wrap).textContent = t;
  const body = $('.sheet-body', rec.wrap), y = body.scrollTop;
  try { body.innerHTML = rec.renderFn(); } catch (e) { console.error(e); body.innerHTML = `<div class="small muted">${esc(e.message)}</div>`; }
  body.scrollTop = y;
  if (rec.onMount) rec.onMount(body);
}
function refreshSheet() { const top = SHEETS[SHEETS.length - 1]; if (top) paintSheet(top); }
function closeSheet() {
  const rec = SHEETS.pop(); if (!rec) return;
  rec.wrap.classList.remove('open');
  setTimeout(() => rec.wrap.remove(), 300);
  if (!SHEETS.length) document.body.style.overflow = '';
  if (rec.onClose) rec.onClose();
}
function closeAllSheets() { while (SHEETS.length) closeSheet(); }

// ---------- toast ----------
function toast(msg, cls = '') {
  let box = $('.toasts'); if (!box) { box = document.createElement('div'); box.className = 'toasts'; document.body.appendChild(box); }
  const t = document.createElement('div'); t.className = 'toast ' + cls; t.textContent = msg; box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 320); }, 2400);
}

// ---------- files, clipboard, sharing ----------
function download(name, content, type) {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
}
async function shareFile(name, blob, text = '') {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], text }); return true; } catch (e) { if (e.name === 'AbortError') return true; }
  }
  download(name, blob); return false;
}
async function shareText(text, title = APP.name) {
  if (navigator.share) { try { await navigator.share({ text, title }); return true; } catch (e) { if (e.name === 'AbortError') return true; } }
  await copyText(text); toast('Copied to clipboard'); return false;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) { } ta.remove(); return ok;
  }
}
function pickFile(accept) {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept;
    i.onchange = () => res(i.files[0] || null); i.click();
  });
}

// ---------- live timers (workout stopwatch, focus countdown) ----------
function timerElapsed(t) { if (!t) return 0; return (t.acc || 0) + (t.start ? (Date.now() - t.start) / 1000 : 0); }
const hms = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(x); };
function tick() {
  $$('[data-timer]').forEach(el => {
    const t = S.timers[el.dataset.timer];
    if (el.dataset.timer === 'focus') {
      const left = t ? t.total - timerElapsed(t) : (S.timers.focusPreset || 25) * 60;
      el.textContent = hms(Math.max(0, left));
      if (t && t.start && left <= 0) focusFinished();
    } else el.textContent = hms(timerElapsed(t));
  });
}
setInterval(() => { if (S && $('[data-timer]')) tick(); }, 1000);

function libraryContext() {
  const L = [], reading = S.library.filter(x => x.status === 'reading');
  const done = S.library.filter(x => x.status === 'done').sort((a, b) => String(b.finished).localeCompare(a.finished)).slice(0, 10);
  const want = S.library.filter(x => x.status === 'want').slice(0, 12);

  if (reading.length) L.push(`Reading now: ${reading.map(t).join('; ')}`);
  if (done.length) L.push(`Recently finished: ${done.map(x => t(x) + (x.rating ? ` ${x.rating}/5` : '')).join('; ')}`);
  if (want.length) L.push(`Already on my list: ${want.map(t).join('; ')}`);

function weekStats() {

  const L = [`Period: ${start} to ${end}`];
  S.habits.forEach(h => {
    let n = 0; for (let i = 0; i < 7; i++) n += habitScore(h, addDays(start, i));
    L.push(h.parts ? `${h.name}: ${Math.round(n * h.parts.length)}/${7 * h.parts.length} (${h.parts.join(', ')})` : `${h.name}: ${Math.round(n)}/7 days`);

  const gdays = Object.entries(S.days).filter(([d]) => inW(d)).map(([, v]) => v.goals || []);
  const gAll = gdays.flat(); if (gAll.length) L.push(`Daily goals: set on ${gdays.filter(g => g.length).length} days, completed ${gAll.filter(g => g.done).length}/${gAll.length}`);
  const rl = S.readingLog.filter(r => inW(r.date)); L.push(`Reading: ${fmtMin(sum(rl, r => r.minutes))} across ${rl.length} sessions`);
  const fin = S.library.filter(x => inW(x.finished)); if (fin.length) L.push(`Finished: ${fin.map(x => x.title).join('; ')}`);
  const wo = S.workouts.filter(w => inW(w.date)); L.push(`Workouts: ${wo.length} (${fmtMin(sum(wo, w => w.minutes))})${wo.length ? ': ' + [...new Set(wo.map(w => w.activity))].join(', ') : ''}`);
  const sl = S.sleep.filter(s => inW(s.date)); if (sl.length) L.push(`Sleep: average ${avg(sl, s => s.hours).toFixed(1)} h, quality ${avg(sl, s => s.quality).toFixed(1)}/10`);
  const ss = S.sessions.filter(s => inW(s.date)); L.push(`Focused work: ${ss.length} sessions, ${fmtMin(sum(ss, s => s.minutes))}`);
  const td = S.tasks.filter(t => t.done && inW(t.doneAt)); if (td.length) L.push(`Tasks completed: ${td.length}`);
  const jj = S.journal.filter(j => inW(j.date) && j.type !== 'legacy'); if (jj.length) L.push(`Journal: ${jj.length} entries, average day rating ${avg(jj.filter(j => j.rating), j => j.rating).toFixed(1)}/10`);
  const pr = S.practice.filter(p => inW(p.date)); if (pr.length) L.push(`Language practice: ${fmtMin(sum(pr, p => p.minutes))}`);
  const it = S.interactions.filter(i => inW(i.date)); if (it.length) L.push(`Time with people: ${it.length} interactions`);
  const fd = Object.entries(S.feed.days).filter(([d]) => inW(d)).map(([, v]) => v); if (fd.length) { const items = fd.flatMap(v => v.items); L.push(`Growth feed: ${fd.filter(v => v.finished).length}/${fd.length} days finished, ${items.filter(i => i.state === 'done' || i.state === 'saved').length} picks read or saved, ${items.filter(i => i.state === 'skip').length} skipped`); }
  return L.join('\n');
}

function buildPrompt(a = ASK) {
  const t = askType(a.type), parts = [];
  const ctx = { item: a.itemId ? byId(S.library, a.itemId) : null, lang: a.lang };
  parts.push(t.ask(a.q, ctx));
  const me = [];
  if (S.settings.about) me.push(`About me: ${S.settings.about}`);
  const tps = a.topics.map(topicOf).filter(Boolean);
  if (tps.length) me.push('My topics:\n' + tps.map(x => `- ${x.name} (${x.level || 'Beginner'})${x.goal ? `: goal: ${x.goal}` : ''}${x.notes ? `. ${x.notes}` : ''}`).join('\n'));
  if (a.lib) { const lc = libraryContext(); if (lc) me.push(lc); }
  if (a.notes) { const nc = notesContext(); if (nc) me.push(nc); }
  if (me.length) parts.push('About me and what I already know:\n' + me.join('\n'));
  if (a.type === 'week') parts.push('My week:\n' + weekStats());
  if (a.type === 'reflect' && a.entry) parts.push(a.entry);
  if (a.type === 'vocab' && a.words) parts.push('Words:\n' + a.words);
  if (t.search !== false) parts.push(GUIDE());
  if (t.adds) parts.push(ADD_FMT);
  return parts.join('\n\n');
}

function normType(t) {
  t = String(t || '').toLowerCase();
  if (/book/.test(t)) return 'book'; if (/paper|study|report|journal|working/.test(t)) return 'paper';
  if (/podcast|episode|audio/.test(t)) return 'podcast'; if (/video|lecture|youtube|talk|documentary/.test(t)) return 'video';
  if (/course|class|mooc/.test(t)) return 'course'; if (/article|essay|news|post|blog|piece|long/.test(t)) return 'article';
  return 'other';
}
function parseSuggestions(text) {
  const items = [];
  for (const raw of String(text || '').split('\n')) {
    const line = raw.replace(/\*\*/g, '').replace(/^[\s>*\-•`]+/, '').trim();
    const m = line.match(/^ADD:\s*(.+)$/i); if (!m) continue;
    const p = m[1].replace(/`+$/, '').split('|').map(s => s.trim());
    let [type, title, author, url, ...why] = p;
    if (!title) continue;
    const link = (url || '').match(/https?:\/\/[^\s)\]]+/);
    items.push({ type: normType(type), title: title.replace(/^["“]|["”]$/g, ''), author: author || '', url: link ? link[0] : '', why: why.join(' | ') });
  }
  if (!items.length) {   // fallback: markdown links
    const seen = new Set();
    for (const m of String(text || '').matchAll(/\[([^\]]{4,140})\]\((https?:\/\/[^\s)]+)\)/g)) {
      if (seen.has(m[2])) continue; seen.add(m[2]);
      items.push({ type: 'article', title: m[1], author: '', url: m[2], why: '' });
    }
  }
  return items;
}
const dupTitle = t => S.library.some(x => x.title.trim().toLowerCase() === String(t).trim().toLowerCase());
function sugCard(x, attrs, on) {
  return `<div class="sug" ${attrs} style="cursor:pointer">${on === undefined ? '' : `<span class="check ${on ? 'on' : ''}" style="width:26px;height:26px">${on ? '✓' : ''}</span>`}<div class="body"><div class="t">${SRC_ICON[x.type] || '🔖'} ${esc(x.title)}</div><div class="m">${esc(x.author)}${x.url ? ` · <a href="${esc(x.url)}" target="_blank" rel="noopener" data-a="noop2">link ↗</a>` : ''}${dupTitle(x.title) ? ' · already in library' : ''}</div>${x.why ? `<div class="w">${esc(x.why)}</div>` : ''}</div></div>`;
}
function addSuggestion(x, topic) {
  if (dupTitle(x.title)) return null;
  const it = { id: uid(), type: x.type, title: x.title, author: x.author, url: x.url, why: x.why, topic: topic || '', status: 'want', priority: 2, from: 'claude', added: today(), rating: 0, notes: '', takeaways: '' };
  S.library.push(it); award('source_add', 'Added: ' + x.title.slice(0, 30), 'sa:' + it.id);
  save(); return it;
}

async function callClaude(prompt, { search = true } = {}) {
  const key = S.settings.apiKey;
  const base = {
    model: S.settings.model || 'claude-sonnet-5-5', max_tokens: 4000,
    system: 'You are a knowledgeable, honest learning coach inside the user\'s private self-development app. Follow the user\'s formatting instructions exactly. For investing, give information and analysis, never personalised buy/sell advice.',
    messages: [{ role: 'user', content: prompt }],
  };
  if (search) base.tools = [{ type: 'web_search_20250305', name: 'web_search', max_uses: 6 }];
  let content = [];
  for (let i = 0; i < 4; i++) {
    const messages = content.length ? [...base.messages, { role: 'assistant', content }] : base.messages;
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ ...base, messages }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error((j.error && j.error.message) || `HTTP ${r.status}`);
    content = content.concat(j.content || []);
    if (j.stop_reason !== 'pause_turn') break;
  }
  let text = '', gap = false;           // keep text written before and after a web search as separate paragraphs
  for (const b of content) { if (b.type === 'text') { if (gap && text) text += '\n\n'; text += b.text; gap = false; } else gap = true; }
  const sources = [];
  content.forEach(b => (b.citations || []).forEach(c => { if (c.url && !sources.some(s => s.url === c.url)) sources.push({ url: c.url, title: c.title || c.url }); }));
  return { text, sources };
}

/* =========================================================================
   GROWTH FEED: a short, finite daily feed tailored to your topics.
   Rotates through the topics marked ⭐, a few per day. One tap opens Claude
   with the request (Claude searches the web); paste the reply back once and
   the picks become cards. When every card is handled, you're done for today.
   ========================================================================= */
const FEED_FMT = n => `Reply with exactly ${n} items and nothing else apart from one short opening line. Put each item on its own line in exactly this format so my app can import it:
FEED: topic | type | title | author or outlet | url | publication date | why it fits me | one-line takeaway
(type is one of: article, paper, report, book, podcast, video, course, news; topic is one of the topic names below)`;

function feedPool() { return S.topics.filter(t => t.focus); }
// Topics shown least recently come first, so manual swaps are respected and every ⭐ topic gets its turn.
function lastShown(id) { let last = ''; for (const [d, v] of Object.entries(S.feed.days)) if (v.topics.includes(id) && d > last) last = d; return last; }
function pickFeedTopics() {
  const pool = feedPool(); if (!pool.length) return [];
  const always = S.feed.always.filter(id => pool.some(t => t.id === id));
  const rest = pool.filter(t => !always.includes(t.id)).map((t, i) => ({ id: t.id, i, last: lastShown(t.id) }))
    .sort((a, b) => a.last.localeCompare(b.last) || a.i - b.i);
  const n = Math.max(0, Math.min(S.feed.aspectsPerDay, pool.length) - always.length);
  return [...always, ...rest.slice(0, n).map(x => x.id)];
}
function feedPlan() {
  const d = today();
  if (!S.feed.plan || S.feed.plan.date !== d) { S.feed.plan = { date: d, topics: pickFeedTopics(), asked: false }; save(); }
  S.feed.plan.topics = S.feed.plan.topics.filter(id => topicOf(id));
  return S.feed.plan;
}
const feedDay = (d = today()) => S.feed.days[d];
const feedCount = () => Math.max(3, feedPlan().topics.length * S.feed.perAspect);

function feedPrompt() {
  const plan = feedPlan(), tps = plan.topics.map(topicOf).filter(Boolean), n = feedCount();
  const parts = [`Build my growth feed for today (${fmtLong(today())}): ${n} items, about ${S.feed.perAspect} for each topic below. For each topic mix something recent (news, article or report from the last few weeks) with something lasting (a book, paper, lecture or classic long read). Every item must be real, credible and findable: peer-reviewed research, official statistics, international organisations, established outlets, well-reviewed books. Match my level and goals, and say in one line why each item fits me.`];
  const me = [];
  if (S.settings.about) me.push(`About me: ${S.settings.about}`);
  if (tps.length) me.push("Today's topics:\n" + tps.map(x => `- ${x.name} (${x.level || 'Beginner'})${x.goal ? `: goal: ${x.goal}` : ''}${x.notes ? `. ${x.notes}` : ''}`).join('\n'));
  if (S.settings.includeLibrary) { const lc = libraryContext(); if (lc) me.push(lc); }
  parts.push('About me:\n' + me.join('\n'));
  const seen = []; Object.keys(S.feed.days).sort().forEach(d => S.feed.days[d].items.forEach(i => seen.push(i.title)));
  if (seen.length) parts.push("Already in my feed, don't repeat: " + seen.slice(-30).map(t => `"${t}"`).join('; '));
  if (S.feed.nope.length) parts.push('I marked these as not for me, so avoid similar ones: ' + S.feed.nope.slice(-15).map(x => `"${x.title}"${x.source ? ` (${x.source})` : ''}`).join('; '));
  parts.push(GUIDE());
  parts.push(FEED_FMT(n));
  return parts.join('\n\n');
}

function matchTopic(name) {
  const n = String(name || '').toLowerCase().replace(/[^\p{L}\p{N}& ]/gu, '').trim();
  if (!n) return '';
  const t = S.topics.find(x => x.name.toLowerCase() === n || x.id === n) || S.topics.find(x => x.name.toLowerCase().includes(n) || n.includes(x.name.toLowerCase()));
  return t ? t.id : '';
}
function parseFeed(text) {
  const out = [];
  for (const raw of String(text || '').split('\n')) {
    const line = raw.replace(/\*\*/g, '').replace(/^[\s>*\-•`\d.)]+/, '').trim();
    const m = line.match(/^FEED:\s*(.+)$/i); if (!m) continue;
    const p = m[1].replace(/`+$/, '').split('|').map(s => s.trim());
    const [tp, type, title, source = '', url = '', date = '', why = '', ...rest] = p;
    if (!title) continue;
    const link = (url || '').match(/https?:\/\/[^\s)\]]+/);
    out.push({ id: uid(), topic: matchTopic(tp), type: normType(type), title: title.replace(/^["“]|["”]$/g, ''), source, url: link ? link[0] : '', date: /^(n\/?a|none|-)$/i.test(date) ? '' : date, why, takeaway: rest.join(' | '), state: 'new' });

function importFeed(items) {
  const d = today(), plan = feedPlan();
  const day = S.feed.days[d] = S.feed.days[d] || { items: [], topics: plan.topics.slice(), finished: false };
  const titles = new Set(day.items.map(i => i.title.toLowerCase()));
  let added = 0;
  items.forEach(i => { if (!titles.has(i.title.toLowerCase())) { day.items.push(i); titles.add(i.title.toLowerCase()); added++; } });
  if (added) day.finished = false;
  Object.keys(S.feed.days).forEach(k => { if (daysBetween(k, d) > 60) delete S.feed.days[k]; });
  save();
  return added;
}

    : `Journal: ${j.date}\nDay rating: ${j.rating}/10${j.mood ? ` · Mood: ${j.mood}` : ''}\n${j.gratitude ? `Grateful for: ${j.gratitude}\n` : ''}${j.lesson ? `Lesson: ${j.lesson}\n` : ''}\n${j.content}`;
}
A.jReflect = el => { const j = byId(S.journal, el.dataset.id); closeSheet(); ASK = newAsk('reflect', { entry: entryText(j), lib: false, notes: false }); openAsk(); };
A.jShare = el => shareText(entryText(byId(S.journal, el.dataset.id)));
A.jEdit = el => { R.editJournal = el.dataset.id; R.editBuf = null; R.sub.journal = 'write'; closeAllSheets(); render(); };
A.jDel = el => { if (!confirm('Delete this entry?')) return; S.journal = S.journal.filter(j => j.id !== el.dataset.id); save(); closeSheet(); render(); };

function journalInsights() {
  const daily = S.journal.filter(j => j.type !== 'legacy');
  if (!daily.length) return empty('📊', 'Write a few entries to see your patterns.');
  const allAvg = avg(daily, j => j.rating), recent = daily.filter(j => inLast(j.date, 30)), recAvg = avg(recent, j => j.rating);
  const grat = daily.filter(j => (j.gratitude || '').trim()).length;
  const series = []; for (let i = 29; i >= 0; i--) { const d = addDays(today(), -i); const e = daily.filter(j => j.date === d); series.push(e.length ? avg(e, j => j.rating) : null); }
  const tags = {}; S.journal.forEach(j => (j.tags || '').split(',').map(t => t.trim().toLowerCase()).filter(Boolean).forEach(t => tags[t] = (tags[t] || 0) + 1));
  const top = Object.entries(tags).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const moods = {}; daily.forEach(j => { if (j.mood) moods[j.mood] = (moods[j.mood] || 0) + 1; });
  const tips = [
    recent.length && recAvg >= allAvg ? '✅ Your recent days are rating as well as or better than usual.' : '💡 Recent days are rating lower than usual. Worth noticing what changed.',
    grat / daily.length > .7 ? '🌟 Strong gratitude practice.' : '💭 Gratitude on more days tends to lift how days feel.',
    daily.length >= 30 ? '📈 You have a solid journaling habit.' : `📝 ${daily.length}/30 entries towards a solid habit.`,
  ];
  return `<div class="grid2 mb">${stat(daily.length, 'Entries')}${stat(allAvg.toFixed(1), 'Average day')}${stat(recent.length ? recAvg.toFixed(1) : '–', 'Last 30 days')}${stat(Math.round(grat / daily.length * 100) + '%', 'With gratitude')}</div>
    <div class="card"><h3>Day rating · last 30 days</h3><div class="mt">${spark(series, { min: 1, max: 10, color: 'var(--c-journal)' })}</div></div>
    ${top.length ? `<div class="card"><h3>Top tags</h3><div class="chips wrap mt">${top.map(([t, n]) => `<span class="chip">${esc(t)} · ${n}</span>`).join('')}</div></div>` : ''}
    ${Object.keys(moods).length ? `<div class="card"><h3>Moods</h3><div class="chips wrap mt">${Object.entries(moods).sort((a, b) => b[1] - a[1]).map(([m, n]) => `<span class="chip">${esc(m)} · ${n}</span>`).join('')}</div></div>` : ''}
    <div class="card"><h3>Insights</h3><ul class="md mt" style="padding-left:18px">${tips.map(t => `<li>${t}</li>`).join('')}</ul></div>
    <div class="small muted center">${QUOTES[new Date().getDate() % QUOTES.length]}</div>`;
}

/* ---------- Habits ---------- */
function trackHabits() {
  const days = []; for (let i = 6; i >= 0; i--) days.push(addDays(today(), -i));
  const active30 = (() => { let n = 0; for (let i = 0; i < 30; i++) { const d = addDays(today(), -i); if (S.habits.some(h => habitScore(h, d) > 0)) n++; } return n; })();
  let html = `<div class="grid2 mb">${stat(`${S.habits.filter(h => habitDone(h)).length}/${S.habits.length}`, 'Done today')}${stat(`${active30}/30`, 'Active days (30d)')}</div>`;
  html += S.habits.map((h, idx) => {
    let c30 = 0; for (let i = 0; i < 30; i++) c30 += habitScore(h, addDays(today(), -i));
    return `<div class="card"><div class="card-head"><h3>${h.emoji} ${esc(h.name)}</h3><button class="link" data-a="habitEdit" data-id="${h.id}">Edit</button></div>
      <div class="row" style="justify-content:space-between"><div class="dots">${days.map(d => {
        const sc = habitScore(h, d); const lbl = parseYmd(d).toLocaleDateString(undefined, { weekday: 'narrow' });
        return `<button class="dot ${sc >= 1 ? 'on' : sc > 0 ? 'half' : ''} ${d === today() ? 'today' : ''}" data-a="${h.parts ? 'habitParts' : 'habitToggle'}" data-id="${h.id}" data-date="${d}" title="${d}">${h.parts && sc > 0 && sc < 1 ? Math.round(sc * h.parts.length) : lbl}</button>`;
      }).join('')}</div><div class="small muted" style="text-align:right">🔥 ${habitStreak(h)}<br>${Math.round(c30 / 30 * 100)}%</div></div>
      ${h.parts ? `<div class="row mt"><span class="small muted">Today</span><span class="spacer"></span>${partsButtons(h)}</div>` : ''}
      <div class="row mt tiny muted"><span>${esc(h.cat || '')}</span><span class="spacer"></span>${idx > 0 ? `<button class="btn ghost sm" data-a="habitMove" data-id="${h.id}" data-d="-1">↑</button>` : ''}${idx < S.habits.length - 1 ? `<button class="btn ghost sm" data-a="habitMove" data-id="${h.id}" data-d="1">↓</button>` : ''}</div></div>`;
  }).join('');
  return html + `<button class="btn soft block" data-a="habitEdit">＋ Add habit</button><div class="small muted center mt">Tap a day to fix a missed log. Streaks count consecutive days.</div>`;
}

/* ---------- Health ---------- */
const ACTIVITIES = ['Gym', 'Cycling', 'Running', 'Swimming', 'Yoga', 'Walking', 'Football', 'Martial arts', 'Sports', 'Other'];
function trackHealth() {
  const t = S.timers.workout, running = t && t.start;
  const w30 = S.workouts.filter(w => inLast(w.date, 30)), s30 = S.sleep.filter(s => inLast(s.date, 30)), n30 = S.nutrition.filter(n => inLast(n.date, 30));
  const mins = sum(w30, w => w.minutes), avgSleep = avg(s30, s => s.hours), avgQ = avg(s30, s => s.quality);
  const active = new Set(Object.keys(S.habitLog).filter(d => inLast(d, 30) && Object.keys(S.habitLog[d]).length)).size;
  const score = Math.round(clamp((Math.min(1, w30.length / 12) + Math.min(1, avgSleep / 8) + Math.min(1, active / 25)) / 3 * 100, 0, 100));
  const sleepSeries = []; for (let i = 13; i >= 0; i--) { const d = addDays(today(), -i); const e = S.sleep.find(s => s.date === d); sleepSeries.push(e ? e.hours : null); }
  const weekly = [3, 2, 1, 0].map(k => S.workouts.filter(w => { const n = daysBetween(w.date, today()); return n >= k * 7 && n < (k + 1) * 7; }).length);
  const recent = [...S.workouts.map(x => ({ ...x, k: 'workout' })), ...S.sleep.map(x => ({ ...x, k: 'sleep' })), ...S.nutrition.map(x => ({ ...x, k: 'nutrition' }))].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 12);
  return `<div class="card"><div class="card-head"><h3>⏱️ Workout timer</h3></div>
      <div class="timer" data-timer="workout">${hms(timerElapsed(t))}</div>
      <div class="btn-row">${running ? `<button class="btn" data-a="wtPause">⏸ Pause</button>` : `<button class="btn ok" data-a="wtStart">▶ ${t ? 'Resume' : 'Start'}</button>`}<button class="btn" data-a="wtReset">Reset</button><button class="btn primary" data-a="qWorkout">Log</button></div></div>
    <div class="quick mb"><button data-a="qWorkout"><span class="e">🏋️</span>Workout</button><button data-a="qSleep"><span class="e">😴</span>Sleep</button><button data-a="qNutrition"><span class="e">🥗</span>Nutrition</button></div>
    <div class="section-label">Last 30 days</div>
    <div class="grid2 mb">${stat(w30.length, 'Workouts')}${stat(fmtMin(mins), 'Exercise time')}${stat(avgSleep ? avgSleep.toFixed(1) + ' h' : '–', 'Average sleep')}${stat(avgQ ? avgQ.toFixed(1) + '/10' : '–', 'Sleep quality')}${stat(n30.length ? avg(n30, n => n.water).toFixed(1) : '–', 'Glasses of water / day')}${stat(score + '/100', 'Health score')}</div>
    <div class="card"><h3>😴 Sleep · last 14 nights</h3><div class="mt">${spark(sleepSeries, { min: 4, max: 10, color: 'var(--c-journal)' })}</div><div class="small muted">${avgSleep && avgSleep < 7 ? '⚠️ Aim for 7–9 hours.' : avgSleep ? '✅ Good sleep hygiene.' : ''}</div></div>
    <div class="card"><h3>🏋️ Workouts per week</h3><div class="mt">${bars(weekly, ['3 wks ago', '2 wks ago', 'Last wk', 'This wk'], { color: 'var(--c-health)' })}</div></div>
    <div class="section-label">Recent logs</div>
    ${recent.length ? `<div class="card tight"><ul class="list">${recent.map(x => `<li class="li" data-a="logOpen" data-k="${x.k}" data-id="${x.id}"><div class="ico">${x.k === 'workout' ? '🏋️' : x.k === 'sleep' ? '😴' : '🥗'}</div><div class="body"><div class="title">${x.k === 'workout' ? `${esc(x.activity)} · ${fmtMin(x.minutes)}` : x.k === 'sleep' ? `${x.hours} h sleep · ${x.quality}/10` : `Nutrition · ${x.water || 0} glasses`}</div><div class="meta">${fmtLong(x.date)}${x.intensity ? ' · ' + esc(x.intensity) : ''}${x.notes ? ' · ' + esc(x.notes) : ''}</div></div></li>`).join('')}</ul></div>` : empty('💪', 'Logs will appear here.')}`;
}

/* ---------- Work ---------- */
const PROJ_CATS = ['Work / consulting', 'Masters / study', 'Research', 'Personal', 'Side project'];
const PROJ_STATUS = [['active', 'Active'], ['planning', 'Planning'], ['on-hold', 'On hold'], ['completed', 'Completed']];
function projProgress(pid) { const ts = S.tasks.filter(t => t.projectId === pid); return { total: ts.length, done: ts.filter(t => t.done).length, pct: ts.length ? ts.filter(t => t.done).length / ts.length : 0 }; }
function trackWork() {
  const ft = S.timers.focus, running = ft && ft.start, preset = S.timers.focusPreset || 25;
  const f = R.filters.projF || 'active';
  const projects = S.projects.filter(p => f === 'all' || (f === 'active' ? p.status !== 'completed' : p.status === 'completed'))
    .sort((a, b) => ({ active: 1, planning: 2, 'on-hold': 3, completed: 4 }[a.status] - { active: 1, planning: 2, 'on-hold': 3, completed: 4 }[b.status]) || (a.priority || 2) - (b.priority || 2) || String(a.deadline || '9').localeCompare(b.deadline || '9'));
  const loose = S.tasks.filter(t => !t.projectId && !t.done);
  const s30 = S.sessions.filter(s => inLast(s.date, 30)), tDone = S.tasks.filter(t => t.done).length;
  const deadlines = [...S.projects.filter(p => p.deadline && p.status !== 'completed').map(p => ({ t: '📊 ' + p.name, d: p.deadline, id: p.id })), ...S.tasks.filter(t => t.deadline && !t.done).map(t => ({ t: '📝 ' + t.text, d: t.deadline, id: t.projectId || '' }))]
    .filter(x => { const n = daysBetween(today(), x.d); return n >= 0 && n <= 30; }).sort((a, b) => a.d.localeCompare(b.d));
  return `<div class="card"><div class="card-head"><h3>🍅 Focus timer</h3><span class="small muted">${ft ? fmtMin(ft.total / 60) + ' session' : ''}</span></div>
      ${ft ? '' : `<div class="chips" style="justify-content:center">${[25, 50, 90, 5, 15].map(m => `<button class="chip ${preset === m ? 'on' : ''}" data-a="focusPreset" data-v="${m}">${m === 5 || m === 15 ? '☕ ' : ''}${m} min</button>`).join('')}</div>`}
      <div class="timer" data-timer="focus">${hms(ft ? ft.total - timerElapsed(ft) : preset * 60)}</div>
      <div class="btn-row">${running ? `<button class="btn" data-a="ftPause">⏸ Pause</button>` : `<button class="btn ok" data-a="ftStart">▶ ${ft ? 'Resume' : 'Start'}</button>`}<button class="btn" data-a="ftReset">Reset</button><button class="btn primary" data-a="sessionLog">Log session</button></div></div>
    <div class="grid3 mb">${stat(S.projects.filter(p => p.status === 'active').length, 'Active projects')}${stat(S.tasks.filter(t => !t.done).length, 'Open tasks')}${stat(fmtMin(sum(s30, s => s.minutes)), 'Focus (30d)')}</div>
    <div class="row" style="justify-content:space-between;margin:0 2px 8px"><div class="section-label" style="margin:0">Projects</div><button class="btn soft sm" data-a="projEdit">＋ Project</button></div>
    ${chips('projF', [['active', 'Open'], ['completed', 'Completed'], ['all', 'All']], f)}
    ${projects.length ? projects.map(p => { const pr = projProgress(p.id); const dl = p.deadline ? daysBetween(today(), p.deadline) : null; return `<div class="card" data-a="openProject" data-id="${p.id}" style="cursor:pointer"><div class="card-head"><h3 style="min-width:0"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span></h3>${pill(PROJ_STATUS.find(s => s[0] === p.status)[1], p.status === 'active' ? 'ok' : p.status === 'completed' ? '' : 'warn')}</div>${bar(pr.pct, 'var(--c-work)')}<div class="row small muted mt"><span>${pr.done}/${pr.total} tasks · ${esc(p.cat)}</span><span class="spacer"></span>${dl != null && p.status !== 'completed' ? pill(dl < 0 ? `${-dl}d overdue` : dl === 0 ? 'Due today' : `${dl}d left`, dl <= 3 ? 'bad' : dl <= 7 ? 'warn' : '') : ''}</div></div>`; }).join('') : empty('📊', 'No projects here yet.')}
    <div class="card"><div class="card-head"><h3>📥 Quick tasks</h3></div>
      ${loose.length ? `<ul class="list">${loose.map(t => taskRow(t)).join('')}</ul>` : '<div class="small muted mb">Tasks without a project.</div>'}
      <form data-f="taskQuick" class="row mt"><input type="text" name="text" placeholder="Add a task…" autocomplete="off"><button class="btn primary" style="flex:none">Add</button></form></div>
    ${deadlines.length ? `<div class="card"><div class="card-head"><h3>📅 Next 30 days</h3><button class="link" data-a="deadlinesIcs">Add to Calendar</button></div><ul class="list">${deadlines.map(x => { const n = daysBetween(today(), x.d); return `<li class="li" style="padding:8px 0" data-a="openProject" data-id="${x.id}"><div class="body"><div class="title">${esc(x.t)}</div><div class="meta">${fmtLong(x.d)}</div></div>${pill(n === 0 ? 'Today' : n + 'd', n <= 3 ? 'bad' : n <= 7 ? 'warn' : 'ok')}</li>`; }).join('')}</ul></div>` : ''}
    <div class="section-label">Recent focus sessions</div>
    ${S.sessions.length ? `<div class="card tight"><ul class="list">${[...S.sessions].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8).map(s => `<li class="li" data-a="sessionOpen" data-id="${s.id}"><div class="ico">⏱️</div><div class="body"><div class="title">${esc(s.topic)} · ${fmtMin(s.minutes)}</div><div class="meta">${fmtLong(s.date)}${s.projectId && byId(S.projects, s.projectId) ? ' · ' + esc(byId(S.projects, s.projectId).name) : ''}</div></div></li>`).join('')}</ul></div>` : empty('⏱️', 'Start the timer, then log what you worked on.')}
    <div class="section-label">Analytics</div>
    <div class="grid2">${stat(S.tasks.length ? Math.round(tDone / S.tasks.length * 100) + '%' : '–', 'Task completion')}${stat(s30.length, 'Sessions (30d)')}${stat((s30.length * 7 / 30).toFixed(1), 'Sessions / week')}${stat(Math.min(100, Math.round((tDone / Math.max(1, S.tasks.length)) * 50 + avg(S.projects, p => projProgress(p.id).pct * 100) * 0.5)) + '/100', 'Productivity score')}</div>`;
}
function taskRow(t) {
  const dl = t.deadline ? daysBetween(today(), t.deadline) : null;

}
A.focusPreset = el => { S.timers.focusPreset = Number(el.dataset.v); save(); render(); };
A.ftStart = () => { const t = S.timers.focus; S.timers.focus = t ? { ...t, start: Date.now(), done: false } : { total: (S.timers.focusPreset || 25) * 60, start: Date.now(), acc: 0 }; save(); render(); };
A.ftPause = () => { const t = S.timers.focus; if (t && t.start) { t.acc = timerElapsed(t); t.start = null; } save(); render(); };
A.ftReset = () => { S.timers.focus = null; save(); render(); };
function focusFinished() {
  const t = S.timers.focus; if (!t || t.done) return;
  t.acc = t.total; t.start = null; t.done = true; save();
  toast('⏰ Focus session complete!'); render();
  if (navigator.vibrate) navigator.vibrate(300);
  if (t.total >= 10 * 60) openSessionSheet(Math.round(t.total / 60));
}
A.sessionLog = () => { const t = S.timers.focus; openSessionSheet(t ? Math.max(1, Math.round(timerElapsed(t) / 60)) : 25); };

const SRS_GOOD = [1, 3, 7, 14, 30, 60], SRS_EASY = [3, 7, 14, 30, 60, 90];
function pageLanguages() {
  const lang = S.settings.currentLang, words = S.vocab.filter(w => w.lang === lang), due = words.filter(w => !w.next || w.next <= today());
  const goals = S.langGoals[lang] || { words: 50, sessions: 5 };
  const monthStart = today().slice(0, 8) + '01', newM = words.filter(w => w.added >= monthStart).length;
  const pr30 = S.practice.filter(p => p.lang === lang && inLast(p.date, 30)), prWk = S.practice.filter(p => p.lang === lang && inLast(p.date, 7)).length;
  const q = (R.filters.vQ || '').toLowerCase();
  const list = words.filter(w => !q || `${w.word} ${w.translation}`.toLowerCase().includes(q)).sort((a, b) => String(b.added).localeCompare(a.added));
  const byType = {}; pr30.forEach(p => byType[p.type] = (byType[p.type] || 0) + p.minutes);
  return backHeader('Languages', `<button class="icon-btn solid" data-a="vocabEdit" aria-label="Add word">＋</button>`) + `
    <div class="chips">${S.settings.languages.map(l => `<button class="chip ${l === lang ? 'on' : ''}" data-a="langSet" data-v="${esc(l)}">${esc(l)}</button>`).join('')}<button class="chip" data-a="langsEdit">Edit</button></div>
    <div class="card" style="background:${due.length ? 'var(--warn-soft)' : 'var(--ok-soft)'}"><div class="row"><div style="flex:1"><b>${due.length ? `🔔 ${plural(due.length, 'word')} due today` : '✅ All caught up'}</b><div class="small muted">${words.length} words in ${esc(lang)} · spaced repetition</div></div>${due.length ? `<button class="btn primary" data-a="reviewStart">Review</button>` : ''}</div></div>
    <div class="btn-row mb"><button class="btn soft" data-a="practiceLog">✍️ Log practice</button><button class="btn soft" data-a="vocabAsk">✨ Practise with Claude</button></div>
    <div class="grid2 mb">${stat(`${newM}/${goals.words}`, 'New words this month')}${stat(`${prWk}/${goals.sessions}`, 'Sessions this week')}${stat(words.length ? (avg(words, w => w.mastery || 0)).toFixed(1) + '/5' : '–', 'Average mastery')}${stat(fmtMin(sum(pr30, p => p.minutes)), 'Practice (30d)')}</div>
    ${Object.keys(byType).length ? `<div class="card"><h3>Practice mix · 30 days</h3><div class="chips wrap mt">${Object.entries(byType).map(([t, m]) => `<span class="chip">${esc(t)} · ${fmtMin(m)}</span>`).join('')}</div></div>` : ''}
    <button class="btn block mb" data-a="langGoals">🎯 Goals: ${goals.words} words/month · ${goals.sessions} sessions/week</button>
    <div class="section-label">Vocabulary</div>
    <input type="search" class="mb" placeholder="Search words" value="${esc(R.filters.vQ || '')}" data-ch="filter" data-k="vQ">
    ${list.length ? `<div class="card tight"><ul class="list">${list.slice(0, 80).map(w => `<li class="li" data-a="vocabEdit" data-id="${w.id}"><div class="body"><div class="title">${esc(w.word)} <span class="muted" style="font-weight:400">· ${esc(w.translation)}</span></div><div class="meta">${'★'.repeat(w.mastery || 0)}${'☆'.repeat(5 - (w.mastery || 0))} · ${w.reviews || 0} reviews · next ${w.next ? fmtDate(w.next) : 'today'}</div></div></li>`).join('')}</ul></div>` : empty('🗣️', 'Add words as you meet them.')}
    <div class="section-label">Recent practice</div>
    ${S.practice.filter(p => p.lang === lang).length ? `<div class="card tight"><ul class="list">${S.practice.filter(p => p.lang === lang).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 10).map(p => `<li class="li" data-a="practiceOpen" data-id="${p.id}"><div class="body"><div class="title">${esc(p.type)} · ${fmtMin(p.minutes)}</div><div class="meta">${fmtLong(p.date)}${p.title ? ' · ' + esc(p.title) : ''}</div></div></li>`).join('')}</ul></div>` : empty('📘', 'No practice logged yet.')}`;
}

  const lang = S.settings.currentLang;
  REV = { ids: S.vocab.filter(w => w.lang === lang && (!w.next || w.next <= today())).sort((a, b) => String(a.next || '').localeCompare(b.next || '') || (a.mastery || 0) - (b.mastery || 0)).map(w => w.id), i: 0, shown: false, n: 0 };

    return `<div class="small muted center mb">${REV.i + 1} / ${REV.ids.length}</div><div class="flash"><div class="w">${esc(w.word)}</div>${REV.shown ? `<div class="tr">${esc(w.translation)}</div>${w.example ? `<div class="ex">${esc(w.example)}</div>` : ''}` : ''}</div>
      ${REV.shown ? `<div class="grid2"><button class="btn danger" data-a="rate" data-v="0">❌ Forgot</button><button class="btn" data-a="rate" data-v="1" style="background:var(--warn-soft);color:var(--warn)">😓 Hard</button><button class="btn" data-a="rate" data-v="2" style="background:var(--ok-soft);color:var(--ok)">✅ Good</button><button class="btn soft" data-a="rate" data-v="3">🌟 Easy</button></div>` : `<button class="btn primary block" data-a="revShow">Show answer</button>`}`;
  });
};
A.revShow = () => { REV.shown = true; refreshSheet(); };
A.rate = el => {
  const w = byId(S.vocab, REV.ids[REV.i]), r = Number(el.dataset.v), m = w.mastery || 0;
  let nm, iv;
  if (r === 0) { nm = Math.max(0, m - 1); iv = 1; } else if (r === 1) { nm = m; iv = 2; } else if (r === 2) { nm = Math.min(5, m + 1); iv = SRS_GOOD[nm]; } else { nm = Math.min(5, m + 2); iv = SRS_EASY[nm]; }
  Object.assign(w, { mastery: nm, reviews: (w.reviews || 0) + 1, next: addDays(today(), iv) });
  award('vocab_review', `Reviewed: ${w.word}`, `vr:${w.id}:${today()}`);
  REV.i++; REV.n++; REV.shown = false; save(); refreshSheet(); render();
};

const REL = ['Family', 'Friend', 'Colleague', 'Professor', 'Mentor', 'Acquaintance', 'Other'];
const REL_ICON = { Family: '👨‍👩‍👧', Friend: '🤝', Colleague: '💼', Professor: '🎓', Mentor: '🌟', Acquaintance: '👋', Other: '👤' };
function nextBirthday(b) { const t = parseYmd(today()), d = parseYmd(b); let n = new Date(t.getFullYear(), d.getMonth(), d.getDate()); if (n < t) n = new Date(t.getFullYear() + 1, d.getMonth(), d.getDate()); return ymd(n); }
function daysToBirthday(b) { return daysBetween(today(), nextBirthday(b)); }
function lastInteraction(cid) { return S.interactions.filter(i => i.contactId === cid).sort((a, b) => b.date.localeCompare(a.date))[0]; }
function needsAttention() { return S.contacts.filter(c => { const l = lastInteraction(c.id); return !l || daysBetween(l.date, today()) > (c.core ? 30 : 60); }); }
function pagePeople() {
  const v = R.filters.pView || 'contacts';
  const wk = S.interactions.filter(i => inLast(i.date, 7)).length;
  let html = backHeader('People', `<button class="icon-btn solid" data-a="contactEdit" aria-label="Add contact">＋</button>`);
  html += `<div class="grid3 mb">${stat(S.contacts.length, 'Contacts')}${stat(wk, 'This week')}${stat(needsAttention().length, 'Reconnect')}</div>`;
  html += chips('pView', [['contacts', 'Contacts'], ['attention', '🔔 Reconnect'], ['birthdays', '🎂 Birthdays'], ['wellness', '💝 Wellness']], v);
  if (v === 'contacts') {
    const rel = R.filters.pRel || '', q = (R.filters.pQ || '').toLowerCase();
    const list = S.contacts.filter(c => (!rel || (rel === 'core' ? c.core : c.relation === rel)) && (!q || `${c.name} ${c.notes} ${c.interests}`.toLowerCase().includes(q))).sort((a, b) => a.name.localeCompare(b.name));
    html += `<div class="row mb"><input type="search" placeholder="Search people" value="${esc(R.filters.pQ || '')}" data-ch="filter" data-k="pQ"><select data-ch="filter" data-k="pRel" style="max-width:40%"><option value="">Everyone</option><option value="core" ${rel === 'core' ? 'selected' : ''}>⭐ Core</option>${opts(REL, rel)}</select></div>`;
    html += list.length ? `<div class="card tight"><ul class="list">${list.map(contactRow).join('')}</ul></div>` : empty('👥', 'Add the people who matter to you.');
  } else if (v === 'attention') {
    const l = needsAttention();
    html += `<div class="small muted mb" style="margin:0 4px 10px">No contact in 60 days (30 for ⭐ core relationships).</div>` + (l.length ? `<div class="card tight"><ul class="list">${l.map(contactRow).join('')}</ul></div>` : empty('✅', 'You are in touch with everyone.'));
  } else if (v === 'birthdays') {
    const l = S.contacts.filter(c => c.birthday).map(c => ({ c, n: daysToBirthday(c.birthday) })).sort((a, b) => a.n - b.n);
    html += l.length ? `<div class="card tight"><ul class="list">${l.map(({ c, n }) => `<li class="li" data-a="openContact" data-id="${c.id}"><div class="ico">🎂</div><div class="body"><div class="title">${esc(c.name)}</div><div class="meta">${fmtDate(nextBirthday(c.birthday), { day: 'numeric', month: 'long' })}</div></div>${pill(n === 0 ? 'Today!' : n === 1 ? 'Tomorrow' : `${n} days`, n <= 7 ? 'bad' : n <= 30 ? 'warn' : '')}</li>`).join('')}</ul></div><button class="btn soft block" data-a="birthdaysIcs">Add birthdays to Calendar</button>` : empty('🎂', 'Add birthdays to contacts to see them here.');
  } else {
    const m = S.interactions.filter(i => i.date >= today().slice(0, 8) + '01'), q30 = S.interactions.filter(i => inLast(i.date, 30) && i.quality);
    const aq = avg(q30, i => i.quality), types = new Set(S.contacts.map(c => c.relation)).size;
    const score = Math.round(Math.min(50, m.length * 2) + (aq / 5) * 30 + Math.min(20, types * 5));
    html += `<div class="card center">${ring(score / 100, 130, 14, 'var(--c-social)', `<div><div style="font-size:30px">${score}</div><div class="tiny muted">/ 100</div></div>`).replace('flex:none', 'flex:none;margin:0 auto')}<div class="small muted mt">Social wellness: frequency, quality and variety of your connections</div></div>
      <div class="grid3 mb">${stat(m.length, 'This month')}${stat(aq ? aq.toFixed(1) + '/5' : '–', 'Quality')}${stat(types, 'Circles')}</div>
      <div class="card"><h3>💡 Ideas for nurturing relationships</h3><textarea class="mt" data-ch="relPlans" placeholder="Coffee with Sarah, call grandparents on Friday, family trip in summer…">${esc(S.relPlans)}</textarea></div>
      <div class="card small"><b>Tips</b><ul class="md" style="padding-left:18px;margin:6px 0 0"><li>Schedule regular check-ins with core relationships</li><li>Quality over quantity</li><li>Remember birthdays and important dates</li><li>Be present: put the phone away</li></ul></div>`;
  }
  return html;
}

function dayData(d = today()) {
  const habits = S.habits.map(h => ({ h, sc: habitScore(h, d), v: habitVal(h.id, d) }));
  const goals = (S.days[d] || {}).goals || [];
  const read = S.readingLog.filter(r => r.date === d), wo = S.workouts.filter(w => w.date === d);
  const sl = S.sleep.find(s => s.date === addDays(d, -1)) || S.sleep.find(s => s.date === d);
  const jr = S.journal.filter(j => j.date === d && j.type !== 'legacy').pop();
  return {
    d, habits, goals, done: habits.filter(x => x.sc >= 1).length,
    readMin: sum(read, r => r.minutes), focusMin: sum(S.sessions.filter(s => s.date === d), s => s.minutes),
    woMin: sum(wo, w => w.minutes), woAct: [...new Set(wo.map(w => w.activity))].join(', '),
    sleepH: sl ? sl.hours : null, tasks: S.tasks.filter(t => t.done && t.doneAt === d).length,
    xp: sum(S.xp.history.filter(x => x.date === d), x => x.xp), rating: jr ? jr.rating : null, lesson: jr ? jr.lesson : '',
    readingNow: (S.library.find(x => x.status === 'reading') || {}).title || '',
  };
}

function drawDayCard(o) {
  const story = o.format !== 'post', W = 1080, H = story ? 1920 : 1350;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), D = dayData(), L = levelInfo(), st = streakNow();
  const FONT = (w, s) => `${w} ${s}px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
  const bg = g.createLinearGradient(0, 0, W * .6, H); bg.addColorStop(0, '#5a67d8'); bg.addColorStop(.55, '#6b46c1'); bg.addColorStop(1, '#8b3fa8');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255,255,255,.07)'; [[W - 60, 140, 280], [60, H - 120, 240], [W - 200, H * .55, 120]].forEach(([x, y, r]) => { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); });
  const rr = (x, y, w, h, r, fill) => { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); g.fillStyle = fill; g.fill(); };
  const text = (t, x, y, f, col = '#fff', align = 'left') => { g.font = f; g.fillStyle = col; g.textAlign = align; g.fillText(t, x, y); };
  const wrap = (t, x, y, maxW, lh, f, col, maxLines) => {
    g.font = f; g.fillStyle = col; g.textAlign = 'left';
    const words = String(t).split(/\s+/); let line = '', n = 0;
    for (const w of words) { const test = line ? line + ' ' + w : w; if (g.measureText(test).width > maxW && line) { if (++n >= maxLines) { g.fillText(line + '…', x, y); return y + lh; } g.fillText(line, x, y); y += lh; line = w; } else line = test; }
    if (line) { g.fillText(line, x, y); y += lh; } return y;
  };
  const M = 72; let y = story ? 250 : 120;
  text(('MY DAY' + (o.name && S.settings.name ? ' · ' + S.settings.name : '')).toUpperCase(), M, y, FONT(700, 32), 'rgba(255,255,255,.75)');
  y += 84; text(parseYmd(D.d).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }), M, y, FONT(800, 70));
  y += 58; text(`${L.avatar} Level ${L.lvl} · ${L.title}     🔥 ${st}-day streak`, M, y, FONT(600, 34), 'rgba(255,255,255,.88)');

  // ring panel
  y += 44; const ph = 300; rr(M - 12, y, W - 2 * M + 24, ph, 36, 'rgba(255,255,255,.13)');
  const cx = M + 150, cy = y + ph / 2, R0 = 112, pct = S.habits.length ? D.done / S.habits.length : 0;
  g.lineCap = 'round'; g.lineWidth = 26; g.strokeStyle = 'rgba(255,255,255,.22)'; g.beginPath(); g.arc(cx, cy, R0, 0, Math.PI * 2); g.stroke();
  g.strokeStyle = '#7CF5B6'; g.beginPath(); g.arc(cx, cy, R0, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pct); g.stroke();
  text(`${D.done}/${S.habits.length}`, cx, cy + 14, FONT(800, 64), '#fff', 'center'); text('habits', cx, cy + 56, FONT(600, 28), 'rgba(255,255,255,.8)', 'center');
  const rx = M + 330; let ry = y + 84;
  const side = [];
  if (o.goals && D.goals.length) side.push(`🎯 ${D.goals.filter(x => x.done).length}/${D.goals.length} goals done`);
  const pr = D.habits.find(x => x.h.parts); if (pr) side.push(`${pr.h.emoji} ${Array.isArray(pr.v) ? pr.v.length : 0}/${pr.h.parts.length} ${pr.h.name.toLowerCase()}`);
  side.push(`⭐ +${D.xp} XP today`);
  if (D.rating) side.push(`😊 Day rated ${D.rating}/10`);
  side.slice(0, 4).forEach(s => { text(s, rx, ry, FONT(700, 38)); ry += 62; });
  y += ph + 34;

  // stat tiles
  if (o.stats) {
    const tiles = [['📖', D.readMin ? fmtMin(D.readMin) : '–', 'reading'], ['⏱️', D.focusMin ? fmtMin(D.focusMin) : '–', 'deep work'], ['🏋️', D.woMin ? fmtMin(D.woMin) : '–', D.woAct ? D.woAct.toLowerCase().slice(0, 16) : 'workout'],
      ['😴', D.sleepH ? D.sleepH + ' h' : '–', 'sleep'], ['✔️', String(D.tasks), 'tasks done'], ['📚', String(S.library.filter(x => x.status === 'done').length), 'sources finished']];
    const gap = 22, tw = (W - 2 * M - 2 * gap) / 3, th = 168;
    tiles.forEach((t, i) => {
      const x = M + (i % 3) * (tw + gap), yy = y + Math.floor(i / 3) * (th + gap);
      rr(x, yy, tw, th, 28, 'rgba(255,255,255,.13)');
      text(t[0], x + 26, yy + 58, FONT(400, 40)); text(t[1], x + 26, yy + 112, FONT(800, 46)); text(t[2], x + 26, yy + 146, FONT(600, 24), 'rgba(255,255,255,.75)');
    });
    y += 2 * th + gap + 40;
  }
  const room = h => y + h < H - 140;

  // habit list
  if (o.habits && story && room(80)) {
    text('HABITS', M, y, FONT(700, 28), 'rgba(255,255,255,.7)'); y += 24;
    const colW = (W - 2 * M) / 2;
    D.habits.slice(0, 8).forEach((x, i) => {
      const hx = M + (i % 2) * colW, hy = y + 40 + Math.floor(i / 2) * 64;
      if (!room(hy - y + 60)) return;
      const label = `${x.sc >= 1 ? '✅' : x.sc > 0 ? '🟡' : '⚪️'} ${x.h.emoji} ${x.h.name}`;
      g.font = FONT(600, 34); let t = label; while (g.measureText(t).width > colW - 20 && t.length > 4) t = t.slice(0, -2);
      text(t === label ? t : t + '…', hx, hy, FONT(600, 34));
    });
    y += 40 + Math.ceil(Math.min(8, D.habits.length) / 2) * 64 + 10;
  }
  if (o.lesson && D.lesson && room(170)) {
    rr(M - 12, y, W - 2 * M + 24, 170, 30, 'rgba(255,255,255,.13)');
    text('💡 TODAY I LEARNED', M + 16, y + 52, FONT(700, 26), 'rgba(255,255,255,.75)');
    wrap(D.lesson, M + 16, y + 100, W - 2 * M - 30, 44, FONT(600, 36), '#fff', 2); y += 200;
  }
  if (o.reading && D.readingNow && room(70)) { wrap(`📚 Reading: ${D.readingNow}`, M, y + 20, W - 2 * M, 46, FONT(600, 36), '#fff', 2); y += 90; }
  text('🌱 Growth Diary', M, H - 80, FONT(700, 30), 'rgba(255,255,255,.75)');
  text('one day at a time', W - M, H - 80, FONT(500, 28), 'rgba(255,255,255,.6)', 'right');
  return c;
}

let SHARE_URL = null;
A.shareDay = () => {
  const o = S.settings.share;
  openSheet('Share my day', () => {
    const c = drawDayCard(o); SHARE_URL = c.toDataURL('image/png');
    return `<div class="share-wrap"><img class="img-preview" src="${SHARE_URL}" alt="Your day card"></div>
      <div class="seg">${[['story', 'Story 9:16'], ['post', 'Post 4:5']].map(([v, l]) => `<button data-a="shareOpt" data-k="format" data-v="${v}" class="${o.format === v ? 'on' : ''}">${l}</button>`).join('')}</div>
      <div class="chips wrap mb">${[['name', 'Name'], ['stats', 'Stats'], ['goals', 'Goals'], ['habits', 'Habit list'], ['lesson', 'Lesson'], ['reading', 'Reading']].map(([k, l]) => `<button class="chip ${o[k] ? 'on' : ''}" data-a="shareOpt" data-k="${k}">${l}</button>`).join('')}</div>
      <button class="btn grad block mb" data-a="shareGo">Share to Instagram, Telegram…</button>
      <button class="btn soft block" data-a="shareSave">Save image</button>
